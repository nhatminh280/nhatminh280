<svg xmlns="http://www.w3.org/2000/svg" width="438" height="300" viewBox="0 0 438 300" role="img" aria-label="Heartify" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><title>Heartify</title><desc>AI backend for Heartify: OCR of medical reports, plus food and exercise recommendation with RAG on Pinecone.</desc><defs><radialGradient id="ga"><stop offset="0" stop-color="#2f5bea" stop-opacity="0.18"/><stop offset="0.55" stop-color="#2f5bea" stop-opacity="0.06"/><stop offset="1" stop-color="#2f5bea" stop-opacity="0"/></radialGradient><radialGradient id="gb"><stop offset="0" stop-color="#0a8bd9" stop-opacity="0.18"/><stop offset="0.55" stop-color="#0a8bd9" stop-opacity="0.06"/><stop offset="1" stop-color="#0a8bd9" stop-opacity="0"/></radialGradient><radialGradient id="gc"><stop offset="0" stop-color="#14b0d9" stop-opacity="0.18"/><stop offset="0.55" stop-color="#14b0d9" stop-opacity="0.06"/><stop offset="1" stop-color="#14b0d9" stop-opacity="0"/></radialGradient><clipPath id="card"><rect x="0.5" y="0.5" width="437" height="299" rx="10"/></clipPath></defs><style>.aur{animation:aur 24s ease-in-out infinite alternate;animation-delay:var(--d)}@keyframes aur{from{transform:translate(0,0)}to{transform:translate(var(--x),var(--y))}}.beam{opacity:0;animation:beam 9s linear infinite both}.chip,.rc{animation:pop 9s ease-out infinite both;animation-delay:calc(var(--i) * 0.4s)}.lk{stroke-dasharray:1;animation:link 9s ease-out infinite both}.sk{transform-box:fill-box;transform-origin:left center;animation:write 9s ease-out infinite both;animation-delay:calc(var(--i) * 0.4s)}@keyframes beam{0%{transform:translateY(0);opacity:0}3%{opacity:1}30%{transform:translateY(62px);opacity:1}34%,100%{transform:translateY(62px);opacity:0}}@keyframes pop{0%,33%{opacity:0}38%,90%{opacity:1}96%,100%{opacity:0}}@keyframes link{0%,44%{stroke-dashoffset:1}52%,90%{stroke-dashoffset:0}96%,100%{stroke-dashoffset:1}}@keyframes write{0%,40%{transform:scaleX(0)}52%,