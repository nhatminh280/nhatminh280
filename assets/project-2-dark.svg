);opacity:0}}@keyframes write{0%,34%{transform:scaleX(0)}44%,88%{transform:scaleX(1)}100%{transform:scaleX(0)}}@media (prefers-reduced-motion: reduce){.aur{animation:none}.pt{animation:none;display:none}.wr{animation:none}}</style><rect x="0.5" y="0.5" width="437" height="299" rx="10" fill="#0b1730" stroke="#1b2d52"/><g clip-path="url(#card)"><circle class="aur a1" cx="70" cy="20" r="190" fill="url(#ga)" style="--x:30px;--y:14px;--d:0s"/><circle class="aur a2" cx="330" cy="120" r="170" fill="url(#gc)" style="--x:-36px;--y:-10px;--d:-8s"/><circle class="aur a3" cx="430" cy="40" r="150" fill="url(#gb)" style="--x:-24px;--y:16px;--d:-14s"/></g><g class="art"><rect x="24" y="25" width="36" height="18" rx="5" fill="#070f23" fill-opacity="0.7" stroke="#1b2d52"/><text x="42" y="37.5" font-size="10" font-weight="400" fill="#8fa6d0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace">rss</text><rect x="24" y="49" width="36" height="18" rx="5" fill="#070f23" fill-opacity="0.7" stroke="#1b2d52"/><text x="42" y="61.5" font-size="10" font-weight="400" fill="#8fa6d0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace">rss</text><rect x="24" y="73" width="36" height="18" rx="5" fill="#070f23" fill-opacity="0.7" stroke="#1b2d52"/><text x="42" y="85.5" font-size="10" font-weight="400" fill="#8fa6d0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace">rss</text><rect x="164" y="14" width="8" height="88" rx="4" fill="#8f94ff" fill-opacity="0.25" stroke="#8f94ff"/><path d="M228 26V86a22 6 0 0 0 44 0V26" fill="#070f23" fill-opacity="0.7" stroke="#6f93ff"/><ellipse cx="250" cy="26" rx="22" ry="6" fill="#070f23" fill-opacity="0.7" stroke="#6f93ff"/><line x1="276" y1="58" x2="330" y2="58" stroke="#6f93ff" stroke-opacity="0.5" stroke-dasharray="3 3"/><rect x="336" y="20" width="76" height="76" rx="6" fill="#070f23" fill-opacity="0.7" stroke="#1b2d52"/><re