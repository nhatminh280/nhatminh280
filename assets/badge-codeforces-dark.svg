<svg xmlns="http://www.w3.org/2000/svg" width="153" height="44" viewBox="0 0 153 44" role="img" aria-label="Codeforces" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><title>Codeforces</title><defs><radialGradient id="g"><stop offset="0" stop-color="#38b6ff" stop-opacity="0.36"/><stop offset="1" stop-color="#38b6ff" stop-opacity="0"/></radialGradient><clipPath id="c"><rect x="0.5" y="0.5" width="152" height="43" rx="10"/></clipPath></defs><style>.rise{animation:rise .6s ease-out both;animation-delay:calc(var(--i) * 0.08s)}@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@media (prefers-reduced-motion: reduce){.rise{animation:none}}</style><g class="badge rise" style="--i:1"><rect x="0.5" y="0.5" width="152" height="43" rx="10" fill="#0b1730" stroke="#1b2d52"/><g clip-path="url(#c)"><circle cx="26" cy="22" r="44" fill="url(#g)"/></g><circle cx="26" cy="22" r="15" fill="#38b6ff" fill-opacity="0.16"/><g class="ico" transform="translate(26 22)" fill="none" stroke="#38b6ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" color="#38b6ff"><rect x="-7.5" y="-1" width="4" height="7" rx="1" fill="currentColor" stroke="none"/><rect x="-2" y="-7" width="4" height="13" rx="1" fill="currentColor" stroke="none"/><rect x="3.5" y="2" width="4" height="4" rx="1" fill="currentColor" stroke="none"/></g><text x="51" y="27" font-size="14" font-weight="600" fill="#e6efff" text-anchor="start">Codeforces</text></g></svg>