<svg xmlns="http://www.w3.org/2000/svg" width="438" height="184" viewBox="0 0 438 184" role="img" aria-label="MPU6050 gesture recognition" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><title>MPU6050 gesture recognition</title><desc>Hand gestures recognised in real time by XGBoost on an ESP32 + MPU6050. F1 0.88 to 0.94 per gesture, accuracy 0.90.</desc><rect x="0.5" y="0.5" width="437" height="183" rx="10" fill="#0b1730" stroke="#1b2d52"/><text x="22" y="38" font-size="17" font-weight="700" fill="#6f93ff" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace">MPU6050 gesture recognition</text><rect x="22" y="50" width="109" height="20" rx="6" fill="#070f23" stroke="#1b2d52"/><text x="30" y="64" font-size="11" font-weight="400" fill="#8fa6d0" text-anchor="start">ML on an ESP32</text><text x="22" y="96" font-size="13" font-weight="400" fill="#e6efff" text-anchor="start">Hand gestures recognised in real time by XGBoost</text><text x="22" y="115" font-size="13" font-weight="400" fill="#e6efff" text-anchor="start">on an ESP32 + MPU6050. F1 0.88 to 0.94 per</text><text x="22" y="134" font-size="13" font-weight="400" fill="#e6efff" text-anchor="start">gesture, accuracy 0.90.</text><circle cx="27" cy="158" r="5" fill="#6a6df0"/><text x="38" y="162" font-size="12" font-weight="400" fill="#8fa6d0" text-anchor="start">C++</text><circle cx="78.6" cy="158" r="5" fill="#1d4ed8"/><text x="89.6" y="162" font-size="12" font-weight="400" fill="#8fa6d0" text-anchor="start">Jupyter Notebook</text></svg>